<!DOCTYPE html>
<html>

<head>

    <title>7f - LinkedIn Signup</title>

    <style>

        .signup {
            width: 330px;
            padding: 15px;
            font-family: Arial;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;

            border: 1px solid #888;
            border-radius: 3px;
        }

        .privacy {
            font-size: 12px;
            color: #555;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 25px;

            background-color: #2867c7;
            color: white;

            font-size: 16px;
        }

    </style>

</head>

<body>

    <div class="signup">

        <label>Email</label>

        <input type="email">

        <p class="privacy">
            By clicking Agree & Join, you agree to the Privacy Policy.
        </p>

        <button>
            Agree & Join
        </button>

    </div>

</body>

</html>
