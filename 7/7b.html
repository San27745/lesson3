<!DOCTYPE html>
<html>

<head>

    <title>7b - Square Image</title>

    <style>
        .square {
            width: 200px;
            height: 200px;
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .square img {
            width: 150px;
            height: 150px;
            object-fit: cover;
        }
    </style>

</head>

<body>

    <div class="square">

        <img src="cat.jpg" alt="Cat">

    </div>

</body>

</html>
