<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9h</title>

    <style>
        .google-container {
            text-align: center;
            margin-top: 50px;
        }

        .google-logo {
            width: 272px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 500px;
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 0 20px;
            font-size: 18px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.15);
            outline: none;
        }

        .buttons {
            margin-top: 25px;
        }

        .google-button {
            background-color: #f8f9fa;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            margin: 0 5px;
        }
    </style>
</head>

<body>

    <div class="google-container">

        <div>
            <img
                class="google-logo"
                src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
                alt="Google"
            >
        </div>

        <div>
            <input
                class="search-box"
                type="text"
                placeholder="Search Google or type a URL"
            >
        </div>

        <div class="buttons">

            <button class="google-button">
                Google Search
            </button>

            <button class="google-button">
                I'm Feeling Lucky
            </button>

        </div>

    </div>

</body>
</html>
