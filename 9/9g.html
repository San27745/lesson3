<!DOCTYPE html>
<html>
<head>
    <title>Exercise 9g</title>

    <style>
        .card {
            width: 220px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
            border: 1px solid #ddd;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
        }

        .profile-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .card-content {
            padding: 10px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 5px;
        }

        .friends {
            color: #666;
            margin: 0 0 10px;
        }

        .add-button {
            background-color: #3875e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 18px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <!-- Card 1 -->
    <div class="card">

        <img
            class="profile-image"
            src="cat.jpg"
            alt="Oliver"
        >

        <div class="card-content">

            <p class="name">Oliver</p>

            <p class="friends">2 mutual friends</p>

            <button class="add-button">
                Add Friend
            </button>

        </div>

    </div>


    <!-- Card 2 -->
    <div class="card">

        <img
            class="profile-image"
            src="cat.jpg"
            alt="Mimi"
        >

        <div class="card-content">

            <p class="name">Mimi</p>

            <p class="friends">3 mutual friends</p>

            <button class="add-button">
                Add Friend
            </button>

        </div>

    </div>


    <!-- Card 3 -->
    <div class="card">

        <img
            class="profile-image"
            src="cat.jpg"
            alt="Rex"
        >

        <div class="card-content">

            <p class="name">Rex</p>

            <p class="friends">4 mutual friends</p>

            <button class="add-button">
                Add Friend
            </button>

        </div>

    </div>

</body>
</html>
