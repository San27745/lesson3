<!DOCTYPE html>
<html>
<head>
    <title>5c - Verdana Font</title>

    <style>
        .box {
            width: 330px;
            padding: 15px;
            font-family: Verdana;
            border: 1px solid #ccc;
        }

        h2 {
            font-size: 20px;
            margin: 0 0 5px;
        }

        .beginner {
            color: gray;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>HTML CSS Course</h2>

        <div class="beginner">
            Beginner to Pro
        </div>

        <p>
            In this course, we'll learn the skills
            you need to become a developer.
        </p>

        <button>Get Started</button>

    </div>

</body>
</html>
