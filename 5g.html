<!DOCTYPE html>
<html>
<head>
    <title>5g - Twitter Text</title>

    <style>
        .tweet {
            width: 600px;
            padding: 15px;
            font-family: Arial;
            border: 1px solid #ddd;
        }

        .name {
            font-weight: bold;
        }

        .username {
            color: gray;
        }

        .time {
            color: gray;
        }

        .mention {
            color: #1da1f2;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="tweet">

        <div>
            <span class="name">freeCodeCamp.org</span>
            <span class="username">@freeCodeCamp</span>
            <span class="time">1h</span>
        </div>

        <p>
            As a web developer, you'll want to make your projects
            easy to use and navigate around.
        </p>

        <p>
            Here
            <span class="mention">@chp_it</span>
            outlines the top skills new developers should have.
        </p>

    </div>

</body>
</html>
