<!DOCTYPE html>
<html>

<head>

    <title>8c - Google Search</title>

    <style>

        .google {
            width: 500px;
            text-align: center;
            font-family: Arial;
        }

        .google-logo {
            width: 250px;
            margin: 20px;
        }

        .search {
            width: 450px;
            padding: 13px 20px;

            border: 1px solid #ddd;
            border-radius: 25px;

            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.15);

            font-size: 16px;
            outline: none;
        }

    </style>

</head>

<body>

    <div class="google">

        <img
            src="google-logo.png"
            class="google-logo"
            alt="Google"
        >

        <input
            class="search"
            type="text"
            placeholder="Search Google or type a URL"
        >

    </div>

</body>

</html>
