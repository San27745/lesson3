<!DOCTYPE html>
<html>

<head>

    <title>8e - Uber Request Form</title>

    <style>

        .uber {
            width: 370px;
            padding: 10px;

            font-family: Arial;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;

            margin-top: 0;
        }

        .location {
            display: block;

            width: 100%;
            box-sizing: border-box;

            padding: 14px;

            margin-bottom: 10px;

            border: none;

            background-color: #eeeeee;

            font-size: 14px;
        }

        .request {
            display: inline-block;

            padding: 13px 20px;

            margin-top: 20px;

            background-color: black;
            color: white;

            border: none;
        }

        .schedule {
            display: inline-block;

            padding: 13px 20px;

            margin-left: 15px;

            background-color: #eeeeee;

            border: none;
        }

    </style>

</head>

<body>

    <div class="uber">

        <h1>Request a ride now</h1>

        <input
            class="location"
            type="text"
            placeholder="Enter pickup location"
        >

        <input
            class="location"
            type="text"
            placeholder="Enter destination"
        >

        <button class="request">
            Request now
        </button>

        <button class="schedule">
            Schedule for later
        </button>

    </div>

</body>

</html>
