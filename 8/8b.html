<!DOCTYPE html>
<html>

<head>

    <title>8b - Inline Block</title>

    <style>

        p {
            width: 260px;

            display: inline-block;
            vertical-align: middle;

            font-size: 18px;
        }

        button {
            display: inline-block;
            vertical-align: middle;

            margin: 5px;
            padding: 5px 12px;
        }

    </style>

</head>

<body>

    <p>
        Thanks for chatting with our customer support.
        Would you like to take our quick survey?
    </p>

    <button>Yes</button>

    <button>No</button>

</body>

</html>
