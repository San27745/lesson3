<!DOCTYPE html>
<html>

<head>

    <title>8d - Sign Up Form</title>

    <style>

        .signup {
            width: 350px;
            padding: 15px;
        }

        .name {
            width: 48%;
            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        .email {
            display: block;

            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin-top: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        .signup-button {
            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: #3478e5;
            color: white;

            font-size: 18px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="signup">

        <input
            class="name"
            type="text"
            placeholder="First name"
        >

        <input
            class="name"
            type="text"
            placeholder="First name"
        >

        <input
            class="email"
            type="email"
            placeholder="Email"
        >

        <button class="signup-button">
            Sign Up
        </button>

    </div>

</body>

</html>
