<!DOCTYPE html>
<html>
<head>
    <title>5f - Stock Price</title>

    <style>
        .stock {
            width: 300px;
            padding: 15px;
            font-family: Arial;
            border: 1px solid #ddd;
        }

        .price {
            font-size: 38px;
        }

        .currency {
            color: gray;
            font-size: 15px;
        }

        .positive {
            color: green;
            font-size: 18px;
        }

        .after {
            color: gray;
            font-size: 16px;
        }

        .negative {
            color: #c44;
        }
    </style>
</head>

<body>

    <div class="stock">

        <div>
            <span class="price">1,049.61</span>
            <span class="currency">USD</span>
        </div>

        <div class="positive">
            +18.05 (1.75%) today
        </div>

        <br>

        <div class="after">
            After hours 1,048.00
            <span class="negative">-1.61 (0.15%)</span>
        </div>

    </div>

</body>
</html>
